
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabetical Article Sorter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Alphabetical Article Sorter</h2>

    <ul id="band"></ul>

    <script>
        const bands = [
            'The Plot in You',
            'The Devil Wears Prada',
            'Pierce the Veil',
            'Norma Jean',
            'The Bled',
            'Say Anything',
            'The Midway State',
            'We Came as Romans',
            'Counterparts',
            'Oh, Sleeper',
            'A Skylit Drive',
            'Anywhere But Here',
            'An Old Dog'
        ];

        // Remove A, An, The and sort
        const sortedBands = bands.sort((a, b) => {
            const nameA = a.replace(/^(a |an |the )/i, '');
            const nameB = b.replace(/^(a |an |the )/i, '');

            return nameA.localeCompare(nameB);
        });

        // Display the sorted articles
        const bandList = document.getElementById('band');

        bandList.innerHTML = sortedBands
            .map(band => `<li>${band}</li>`)
            .join('');

    </script>

</body>
</html>
